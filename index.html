<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>LLM Traffic Sim</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
        }

        canvas {
            background: #3a7d44;
        }
    </style>
</head>

<body>
    <canvas id="sim" width="800" height="800"></canvas>
    <script>
        const canvas = document.getElementById("sim");
        const ctx = canvas.getContext("2d");

        const SIZE = 800, C = 400, ROAD = 160, H = ROAD / 2;

        // ---- Traffic lights ----
        const phases = [
            { ns: "GREEN", ew: "RED", ms: 6000 },
            { ns: "YELLOW", ew: "RED", ms: 2000 },
            { ns: "RED", ew: "RED", ms: 1000 },
            { ns: "RED", ew: "GREEN", ms: 6000 },
            { ns: "RED", ew: "YELLOW", ms: 2000 },
            { ns: "RED", ew: "RED", ms: 1000 },
        ];
        const cycleMs = phases.reduce((s, p) => s + p.ms, 0);

        function currentPhase(now) {
            let t = now % cycleMs;
            for (const p of phases) {
                if (t < p.ms) return p;
                t -= p.ms;
            }
        }

        // dir = "N", "S", "E" or "W" (the side the car comes from)
        function getLightState(dir) {
            const p = currentPhase(performance.now());
            return (dir === "N" || dir === "S") ? p.ns : p.ew;
        }

        // ---- Drawing ----
        function drawRoad() {
            ctx.fillStyle = "#3a7d44";
            ctx.fillRect(0, 0, SIZE, SIZE);

            ctx.fillStyle = "#444";
            ctx.fillRect(C - H, 0, ROAD, SIZE);   // vertical road
            ctx.fillRect(0, C - H, SIZE, ROAD);   // horizontal road

            // dashed lane lines
            ctx.strokeStyle = "white";
            ctx.lineWidth = 2;
            ctx.setLineDash([16, 14]);
            for (const o of [-H / 2, H / 2]) {
                line(C + o, 0, C + o, C - H);
                line(C + o, C + H, C + o, SIZE);
                line(0, C + o, C - H, C + o);
                line(C + H, C + o, SIZE, C + o);
            }

            // yellow centre lines
            ctx.setLineDash([]);
            ctx.strokeStyle = "#f5c518";
            line(C, 0, C, C - H);
            line(C, C + H, C, SIZE);
            line(0, C, C - H, C);
            line(C + H, C, SIZE, C);

            // stop lines
            ctx.strokeStyle = "white";
            ctx.lineWidth = 5;
            line(C - H, C - H, C, C - H);   // from North
            line(C, C + H, C + H, C + H);   // from South
            line(C - H, C, C - H, C + H);   // from West
            line(C + H, C - H, C + H, C);   // from East
        }

        function line(x1, y1, x2, y2) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawLight(x, y, state) {
            ctx.fillStyle = "#111";
            ctx.fillRect(x, y, 22, 62);
            const lamps = [["RED", "#ff3b30"], ["YELLOW", "#ffcc00"], ["GREEN", "#34c759"]];
            lamps.forEach(([name, color], i) => {
                ctx.beginPath();
                ctx.arc(x + 11, y + 11 + i * 20, 8, 0, Math.PI * 2);
                ctx.fillStyle = state === name ? color : "#333";
                ctx.fill();
            });
        }

        function drawLights() {
            drawLight(C - H - 30, C - H - 70, getLightState("N"));
            drawLight(C + H + 8, C + H + 8, getLightState("S"));
            drawLight(C - H - 70, C + H + 8, getLightState("W"));
            drawLight(C + H + 48, C - H - 70, getLightState("E"));
        }
        // ---- HUD ----
        const hud = { collisions: 0, latencyMs: null, cleared: 0 };

        function drawHUD() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(10, 10, 230, 100);

            ctx.font = "16px Arial";
            ctx.textAlign = "left";

            ctx.fillStyle = hud.collisions > 0 ? "#ff3b30" : "#34c759";
            ctx.fillText("Collisions: " + hud.collisions, 22, 38);

            ctx.fillStyle = "white";
            const lat = hud.latencyMs === null ? "--" : Math.round(hud.latencyMs) + " ms";
            ctx.fillText("LLM latency: " + lat, 22, 65);
            ctx.fillText("Cleared: " + hud.cleared, 22, 92);
        }

        // ---- Cars ----
        const L = 30, W = 16;       // car length and width (pixels)
        const MAX_SPEED = 120;      // px per second
        const ACC = 60;             // max acceleration (px/s²)
        const DEC = 150;            // max braking (px/s²)
        const STOP_S = 320;         // distance from spawn edge to the stop line
        const MAX_CARS = 20;

        // lane centre for each direction (x for N/S, y for W/E)
        const LANES = { N: [340, 380], S: [460, 420], W: [420, 460], E: [380, 340] };
        const COLORS = { N: "#4da3ff", S: "#ff9f43", W: "#c77dff", E: "#ffd166" };

        let cars = [];
        let nextId = 0;

        function spawnCar() {
            if (cars.length >= MAX_CARS) return;
            const dir = ["N", "S", "E", "W"][Math.floor(Math.random() * 4)];
            const lane = Math.floor(Math.random() * 2);
            const same = cars.filter(c => c.dir === dir && c.lane === lane);
            const rearMost = same.length ? Math.min(...same.map(c => c.s - L)) : Infinity;
            if (rearMost < 60) return;   // not enough space at the entrance
            cars.push({ id: nextId++, dir, lane, s: 0, v: 60, action: { action: "MAINTAIN" } });
        }

        // centre position and rotation of a car on the canvas
        function carPos(c) {
            const m = c.s - L / 2;
            if (c.dir === "N") return { x: LANES.N[c.lane], y: m, a: Math.PI / 2 };
            if (c.dir === "S") return { x: LANES.S[c.lane], y: SIZE - m, a: -Math.PI / 2 };
            if (c.dir === "W") return { x: m, y: LANES.W[c.lane], a: 0 };
            return { x: SIZE - m, y: LANES.E[c.lane], a: Math.PI };
        }

        const clamp01 = x => Math.min(1, Math.max(0, x));

        function applyPhysics(c, dt) {
            const a = c.action;
            let acc = 0;
            if (a.action === "ACCELERATE") acc = clamp01(a.throttle ?? 0.5) * ACC;
            else if (a.action === "BRAKE") acc = -clamp01(a.intensity ?? 0.5) * DEC;
            c.v = Math.min(MAX_SPEED, Math.max(0, c.v + acc * dt));
            c.s += c.v * dt;
        }

        // TEMPORARY test driver. Step 6 replaces this with the LLM.
        function decideTest(c) {
            const v = c.v;
            let brake = 0;

            let ahead = null;
            for (const o of cars) {
                if (o !== c && o.dir === c.dir && o.lane === c.lane && o.s > c.s && (!ahead || o.s < ahead.s)) ahead = o;
            }
            if (ahead) {
                const gap = (ahead.s - L) - c.s;
                if (gap < 12) return v > ahead.v ? { action: "BRAKE", intensity: 1 } : { action: "MAINTAIN" };
                if (v > ahead.v) brake = Math.max(brake, ((v * v - ahead.v * ahead.v) / (2 * (gap - 8))) / (DEC * 0.8));
            }

            const state = getLightState(c.dir);
            const dist = STOP_S - c.s;
            if (state !== "GREEN" && dist > 0) {
                const raw = (v * v) / (2 * Math.max(dist - 4, 0.5)) / DEC;
                if (!(state === "YELLOW" && raw > 1)) brake = Math.max(brake, raw / 0.8);
                if (dist < 8 && v < 10) return { action: "BRAKE", intensity: 1 };
            }

            if (brake > 0.03) return { action: "BRAKE", intensity: Math.min(1, brake) };
            return { action: "ACCELERATE", throttle: 0.8 };
        }

        // ---- Collision counting ----
        function box(c) {
            const p = carPos(c);
            const horiz = c.dir === "W" || c.dir === "E";
            const w = horiz ? L : W, h = horiz ? W : L;
            return { x1: p.x - w / 2, x2: p.x + w / 2, y1: p.y - h / 2, y2: p.y + h / 2 };
        }

        let touching = new Set();
        function checkCollisions() {
            const now = new Set();
            for (let i = 0; i < cars.length; i++) {
                for (let j = i + 1; j < cars.length; j++) {
                    const a = box(cars[i]), b = box(cars[j]);
                    if (a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1) {
                        const key = cars[i].id + "-" + cars[j].id;
                        now.add(key);
                        if (!touching.has(key)) hud.collisions++;
                    }
                }
            }
            touching = now;
        }

        // ---- Update and draw cars ----
        let lastT = performance.now(), spawnTimer = 0;

        function update(dt) {
            spawnTimer += dt;
            if (spawnTimer > 1) { spawnTimer = 0; spawnCar(); }
            for (const c of cars) c.action = decideTest(c);
            for (const c of cars) applyPhysics(c, dt);
            checkCollisions();
            cars = cars.filter(c => {
                if (c.s - L > SIZE) { hud.cleared++; return false; }
                return true;
            });
        }

        function drawCars() {
            for (const c of cars) {
                const p = carPos(c);
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.a);
                ctx.fillStyle = COLORS[c.dir];
                ctx.fillRect(-L / 2, -W / 2, L, W);
                ctx.fillStyle = "#111";
                ctx.fillRect(L / 2 - 8, -W / 2 + 2, 6, W - 4);       // windscreen (front)
                if (c.action.action === "BRAKE") {
                    ctx.fillStyle = "#ff3b30";
                    ctx.fillRect(-L / 2, -W / 2, 3, W);                // brake light (rear)
                }
                ctx.restore();
            }
        }// ---- Main loop ----
        function frame(t) {
            const dt = Math.min((t - lastT) / 1000, 0.05);
            lastT = t;
            update(dt);
            drawRoad();
            drawLights();
            drawCars();
            drawHUD();
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);
    </script>
</body>

</html>
